<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duoan · 让陪伴更有温度</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="page">
    <!-- 顶栏 -->
    <header class="top-bar">
      <a href="#" class="brand">
        <img src="assets/logo.png" alt="Duoan" class="brand-logo" />
        <span class="brand-name">Duoan</span>
      </a>
      <div class="top-actions">
        <button type="button" class="pill-btn pill-btn--outline">语言</button>
        <button type="button" class="icon-btn" aria-label="收藏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        </button>
        <button type="button" class="icon-btn cart-btn" aria-label="购物车">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge">0</span>
        </button>
      </div>
    </header>

    <!-- 主导航 -->
    <nav class="main-nav" aria-label="主导航">
      <a href="#" class="nav-link nav-link--active">首页</a>
      <a href="#toys" class="nav-link">玩具</a>
      <a href="#promo" class="nav-link">活动宣传</a>
      <a href="#about" class="nav-link">关于我们</a>
      <a href="#contact" class="nav-link">联系我们</a>
      <div class="nav-search">
        <input type="search" placeholder="搜索玩具..." aria-label="搜索" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
    </nav>

    <!-- Hero -->
    <section class="hero" id="home">
      <div class="hero-bg"></div>
      <div class="hero-inner">
        <div class="hero-left">
          <img src="assets/hero-illustration.png" alt="" class="hero-sketch" />
          <div class="hero-tag">怪兽天团系列</div>
          <div class="hero-dots" aria-hidden="true">
            <span class="dot dot--active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
        <div class="hero-right">
          <div class="hero-image-wrap">
            <img src="assets/hero-product.png" alt="毛绒玩具" class="hero-product" />
          </div>
          <div class="hero-caption">
            <p class="hero-slogan">让陪伴更有温度</p>
            <p class="hero-brand">Duoan</p>
          </div>
          <a href="#shop" class="btn-buy">立即购买</a>
          <div class="hero-arrows">
            <button type="button" class="arrow-btn" id="hero-prev" aria-label="上一张">‹</button>
            <button type="button" class="arrow-btn" id="hero-next" aria-label="下一张">›</button>
          </div>
        </div>
      </div>
    </section>

    <!-- 分类图标 -->
    <section class="categories" aria-label="玩具分类">
      <div class="categories-track">
        <div class="category-item"><img src="assets/category-1.png" alt="企鹅" /></div>
        <div class="category-item"><img src="assets/category-2.png" alt="小鸡" /></div>
        <div class="category-item"><img src="assets/category-3.png" alt="兔子" /></div>
        <div class="category-item"><img src="assets/category-4.png" alt="粉熊" /></div>
        <div class="category-item"><img src="assets/category-5.png" alt="大象" /></div>
        <div class="category-item"><img src="assets/category-6.png" alt="小龙" /></div>
        <div class="category-item"><img src="assets/category-7.png" alt="长颈鹿" /></div>
      </div>
    </section>

    <!-- 系列玩具 -->
    <section class="series" id="toys">
      <h2 class="section-title section-title--tilt">系列玩具</h2>
      <div class="series-wave series-wave--top"></div>
      <div class="series-grid">
        <article class="series-card series-card--left">
          <span class="badge-new">new</span>
          <div class="series-circle">
            <img src="assets/series-left.png" alt="绒绒小怪兽系列" />
          </div>
          <h3>绒绒小怪兽系</h3>
        </article>
        <article class="series-card series-card--center">
          <div class="series-circle series-circle--lg">
            <img src="assets/series-center.png" alt="森林小伙伴系列" />
          </div>
          <h3>森林小伙伴系列</h3>
        </article>
        <article class="series-card series-card--right">
          <span class="badge-new">new</span>
          <div class="series-circle">
            <img src="assets/series-right.png" alt="甜睡派对系列" />
          </div>
          <h3>甜睡派对系列</h3>
        </article>
      </div>
      <div class="series-wave series-wave--bottom"></div>
    </section>

    <!-- 最新畅销 -->
    <section class="bestsellers" id="promo">
      <h2 class="section-title">最新畅销产品</h2>
      <div class="bestsellers-inner">
        <div class="bestsellers-product">
          <span class="badge-new badge-new--lg">new</span>
          <div class="product-photo">
            <img src="assets/product-ducks.png" alt="小鸭毛绒玩具" />
          </div>
          <a href="#shop" class="btn-flash">立即购买同款玩具</a>
          <button type="button" class="cart-mini" aria-label="加入购物车">+</button>
        </div>
        <div class="bestsellers-calendar">
          <div class="calendar-card">
            <h3>按日期选择</h3>
            <p class="calendar-month">2026年3月</p>
            <div class="calendar-days">
              <div class="day-box">
                <span class="day-num">2</span>
                <span class="day-label">周一</span>
              </div>
              <div class="day-box">
                <span class="day-num">3</span>
                <span class="day-label">周二</span>
              </div>
              <div class="day-box">
                <span class="day-num">4</span>
                <span class="day-label">周三</span>
              </div>
            </div>
            <a href="#" class="calendar-more">更多 →</a>
          </div>
        </div>
        <img src="assets/car.png" alt="" class="deco-car" aria-hidden="true" />
      </div>
    </section>

    <!-- 关于我们 -->
    <section class="about" id="about">
      <h2 class="section-title">关于我们</h2>
      <div class="about-book">
        <div class="book-page book-page--text">
          <a href="#" class="book-more" aria-label="了解更多">››</a>
          <div class="about-copy">
            <p>我们</p>
            <p>以童真与温暖为内核，</p>
            <p>兼顾儿童使用安全与成人治愈需求，成为传递美好与陪伴的暖心礼物之选。</p>
          </div>
        </div>
        <div class="book-spine"></div>
        <div class="book-page book-page--illust">
          <img src="assets/about-castle.png" alt="童话城堡插画" />
        </div>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="contact">
      <div class="footer-awning"></div>
      <div class="footer-inner">
        <form class="subscribe" onsubmit="return false;">
          <input type="email" placeholder="输入邮箱订阅资讯" aria-label="邮箱" />
          <button type="submit">订阅</button>
        </form>

        <div class="footer-grid">
          <div class="footer-brand-col">
            <img src="assets/logo.png" alt="Duoan" class="footer-logo" />
            <div class="footer-contact">
              <p><strong>联系信息</strong></p>
              <p>地址：北京市朝阳区230号</p>
              <p>电话：123-456-888</p>
              <p>邮箱：122@333.com</p>
            </div>
            <div class="social-links">
              <a href="#" aria-label="微信">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 11.5a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm7 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zM12 2C6.48 2 2 6.02 2 10.8c0 2.78 1.4 5.26 3.6 6.9L4 22l4.2-2.1c1.1.3 2.2.5 3.3.5 1.1 0 2.2-.2 3.3-.5L19 22l-1.6-4.3c2.2-1.64 3.6-4.12 3.6-6.9C21 6.02 16.52 2 12 2z"/></svg>
              </a>
              <a href="#" aria-label="微博">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.5 20.5c-4.42 0-8-2.24-8-5s3.58-5 8-5 8 2.24 8 5-3.58 5-8 5zm9-10c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zM4 8.5C2.9 8.5 2 7.6 2 6.5S2.9 4.5 4 4.5 6 5.4 6 6.5 5.1 8.5 4 8.5z"/></svg>
              </a>
              <a href="#" aria-label="推特">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
              </a>
            </div>
          </div>
          <div class="footer-links-col">
            <p><strong>快速链接</strong></p>
            <a href="#">首页</a>
            <a href="#toys">玩具</a>
            <a href="#promo">活动宣传</a>
            <a href="#about">关于我们</a>
            <a href="#contact">联系我们</a>
          </div>
        </div>
      </div>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
