<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duoan · 让陪伴更有温度</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="canvas">
    <!-- 顶栏 + 导航（Figma 叠层结构） -->
    <header class="site-header">
      <div class="top-strip">
        <a href="#" class="brand">
          <img src="assets/logo.png" alt="Duoan" class="brand-logo" />
        </a>
        <div class="top-strip__actions">
          <button type="button" class="lang-btn">
            <svg class="lang-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            语言
          </button>
          <button type="button" class="icon-round" aria-label="收藏">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </button>
          <button type="button" class="icon-round cart" aria-label="购物车">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span class="cart-badge">0</span>
          </button>
        </div>
      </div>
      <nav class="pink-nav" aria-label="主导航">
        <span class="nav-dot" aria-hidden="true"></span>
        <a href="#" class="nav-pill nav-pill--active">首页</a>
        <a href="#toys" class="nav-pill">玩具</a>
        <a href="#promo" class="nav-pill">活动宣传</a>
        <a href="#about" class="nav-pill">关于我们</a>
        <a href="#contact" class="nav-pill">联系我们</a>
        <div class="nav-search">
          <input type="search" placeholder="" aria-label="搜索" />
          <span class="nav-search__icon" aria-hidden="true">⌕</span>
        </div>
      </nav>
    </header>

    <!-- Hero -->
    <section class="hero" id="home">
      <div class="hero__layout">
        <div class="hero__left">
          <img src="assets/hero-wave.png" alt="" class="hero__wave" />
          <img src="assets/hero-illustration.png" alt="" class="hero__sketch" />
        </div>
        <div class="hero__right">
          <div class="hero__frame">
            <a href="#toys" class="hero__series-tag">怪兽天团系列 <span aria-hidden="true">›</span></a>
            <img src="assets/hero-product.png" alt="毛绒玩具" class="hero__photo" />
            <a href="#shop" class="hero__buy">立即购买</a>
          </div>
          <div class="hero__meta">
            <div class="hero__text">
              <p class="hero__slogan">让陪伴更有温度</p>
              <p class="hero__brand">Duoan</p>
            </div>
            <div class="hero__arrows">
              <button type="button" class="hero__arrow" id="hero-prev" aria-label="上一张">‹</button>
              <button type="button" class="hero__arrow" id="hero-next" aria-label="下一张">›</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 分类（Figma 各图标尺寸不一，底部对齐） -->
    <section class="categories" aria-label="玩具分类">
      <div class="categories__row">
        <div class="cat cat--1"><img src="assets/category-1.png" alt="企鹅" /></div>
        <div class="cat cat--2"><img src="assets/category-2.png" alt="小鸡" /></div>
        <div class="cat cat--3"><img src="assets/category-3.png" alt="兔子" /></div>
        <div class="cat cat--4"><img src="assets/category-4.png" alt="粉熊" /></div>
        <div class="cat cat--5"><img src="assets/category-5.png" alt="大象" /></div>
        <div class="cat cat--6"><img src="assets/category-6.png" alt="小龙" /></div>
        <div class="cat cat--7"><img src="assets/category-7.png" alt="长颈鹿" /></div>
      </div>
    </section>

    <!-- 系列玩具 -->
    <section class="series" id="toys">
      <div class="series__curve series__curve--top"></div>
      <h2 class="series__title">系列玩具</h2>
      <div class="series__row">
        <article class="series-item series-item--sm">
          <span class="star-badge">new</span>
          <div class="series-item__ring">
            <img src="assets/series-left.png" alt="绒绒小怪兽系" />
          </div>
          <p>绒绒小怪兽系</p>
        </article>
        <article class="series-item series-item--lg">
          <div class="series-item__ring">
            <img src="assets/series-center.png" alt="森林小伙伴系列" />
          </div>
          <p>森林小伙伴系列</p>
        </article>
        <article class="series-item series-item--sm">
          <span class="star-badge">new</span>
          <div class="series-item__ring">
            <img src="assets/series-right.png" alt="甜睡派对系列" />
          </div>
          <p>甜睡派对系列</p>
        </article>
      </div>
      <div class="series__curve series__curve--bottom"></div>
    </section>

    <!-- 最新畅销 -->
    <section class="hot" id="promo">
      <h2 class="hot__title">最新畅销产品</h2>
      <div class="hot__panel">
        <div class="hot__left">
          <span class="star-badge star-badge--hot">new</span>
          <div class="hot__photo-wrap">
            <img src="assets/product-ducks.png" alt="小鸭毛绒玩具" class="hot__photo" />
          </div>
          <a href="#shop" class="hot__cta">立即购买同款玩具</a>
          <button type="button" class="hot__cart" aria-label="加入购物车">+</button>
        </div>
        <div class="hot__right">
          <div class="hot__calendar">
            <h3>按日期选择</h3>
            <p class="hot__month">2026年3月</p>
            <div class="hot__days">
              <div><b>2</b><span>周一</span></div>
              <div><b>3</b><span>周二</span></div>
              <div><b>4</b><span>周三</span></div>
            </div>
            <a href="#" class="hot__more">更多</a>
          </div>
        </div>
        <img src="assets/car.png" alt="" class="hot__car" aria-hidden="true" />
      </div>
    </section>

    <!-- 关于我们 -->
    <section class="about" id="about">
      <h2 class="about__title">关于我们</h2>
      <div class="about__frame">
        <div class="about__book">
          <a href="#" class="about__link" aria-label="更多">››</a>
          <div class="about__text">
            <p>我们</p>
            <p>以童真与温暖为内核，</p>
            <p>兼顾儿童使用安全与成人治愈需求，成为传递美好与陪伴的暖心礼物之选。</p>
          </div>
          <div class="about__art">
            <img src="assets/about-castle.png" alt="城堡插画" />
          </div>
        </div>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer" id="contact">
      <div class="footer__scallop"></div>
      <div class="footer__body">
        <form class="footer__subscribe" onsubmit="return false;">
          <input type="email" placeholder="输入邮箱订阅资讯" aria-label="邮箱" />
          <button type="submit">订阅</button>
        </form>
        <div class="footer__cols">
          <div>
            <img src="assets/logo.png" alt="Duoan" class="footer__logo" />
            <div class="footer__info">
              <p><strong>联系信息</strong></p>
              <p>地址：北京市朝阳区230号</p>
              <p>电话：123-456-888</p>
              <p>邮箱：122@333.com</p>
            </div>
            <div class="footer__social">
              <a href="#" aria-label="微信">微</a>
              <a href="#" aria-label="微博">博</a>
              <a href="#" aria-label="推特">X</a>
            </div>
          </div>
          <div class="footer__links">
            <p><strong>快速链接</strong></p>
            <a href="#">首页</a>
            <a href="#toys">玩具</a>
            <a href="#promo">活动宣传</a>
            <a href="#about">关于我们</a>
            <a href="#contact">联系我们</a>
          </div>
        </div>
      </div>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
